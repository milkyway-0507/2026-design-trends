<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="2026년 주요 디자인 트렌드 30가지를 한국어로 큐레이션하고 라이브 프리뷰로 직접 체험할 수 있는 사이트"
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="2026 디자인 트렌드" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="2026 디자인 트렌드 — 30가지를 한국어로 큐레이션" />
    <meta
      property="og:description"
      content="컬러, 타이포, 모션, AI UX 등 2026년 디자인 트렌드 30가지를 라이브 프리뷰로 직접 체험하세요."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1020" />
    <meta property="og:image:height" content="633" />
    <meta property="og:image:alt" content="2026 디자인 트렌드 — 30가지 트렌드 라이브 큐레이션" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2026 디자인 트렌드 — 30가지를 한국어로 큐레이션" />
    <meta
      name="twitter:description"
      content="컬러, 타이포, 모션, AI UX 등 2026년 디자인 트렌드 30가지를 라이브 프리뷰로 직접 체험하세요."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="2026 디자인 트렌드 — 30가지 트렌드 라이브 큐레이션" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8F7FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06060F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>2026 디자인 트렌드</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 핵심 폰트: preload → 즉시 로드 (히어로·헤더) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
    <!-- 나머지 폰트: FontGrid viewport 진입 시 fontLoader.ts에서 동적 로드 -->

    <script src="/theme-init.js"></script>

    <style id="theme-critical">
      html {
        color-scheme: light dark;
      }
      html[data-theme='light'] {
        background-color: #f8f7ff;
        color: #0d0d1a;
      }
      html[data-theme='dark'] {
        background-color: #06060f;
        color: #f0f0ff;
      }
    </style>

    <style id="inject-hero-enhancements">
      .hero__title,
      .hero__year,
      .trends-section__title,
      .site-header__logo {
        font-family: 'Space Grotesk', var(--font-family-sans);
      }

      .trend-card[data-category='color'] {
        --card-accent: #ec4899;
      }
      .trend-card[data-category='typography'] {
        --card-accent: #6366f1;
      }
      .trend-card[data-category='motion'] {
        --card-accent: #06b6d4;
      }
      .trend-card[data-category='layout'] {
        --card-accent: #f97316;
      }
      .trend-card[data-category='ai-ux'] {
        --card-accent: #a78bfa;
      }
      .trend-card[data-category='visual'] {
        --card-accent: #14b8a6;
      }
      .trend-card[data-category='accessibility'] {
        --card-accent: #22c55e;
      }
      .trend-card[data-category='interaction'] {
        --card-accent: #f59e0b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
