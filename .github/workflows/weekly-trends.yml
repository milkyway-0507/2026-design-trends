name: 매주 트렌드 자동 업데이트

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9 → UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      - name: LLM Proxy로 트렌드 생성
        env:
          STUDY_LLM_API_TOKEN: ${{ secrets.STUDY_LLM_API_TOKEN }}
        run: node scripts/generate-trends.mjs

      - name: 변경사항 확인
        id: check_changes
        run: |
          git diff --quiet src/data/trends.ts src/data/trends-new.ts TREND_UPDATE_LOG.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: PR 생성
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "✨ 주간 트렌드 업데이트 $(date +'%Y-%m-%d')"
          title: "🔥 이번 주 신규 트렌드 추가 — $(date +'%Y년 %m월 %d일')"
          body: |
            ## 이번 주 자동 업데이트
            - Vibe LLM Proxy(Gemini)가 최신 디자인 트렌드를 조사해 자동 추가했습니다
            - 내용 검토 후 머지해주세요
            - 머지 시 Vercel 자동 배포됩니다
          branch: "weekly-trend-$(date +'%Y%m%d')"
          base: main
          labels: auto-update,trends
