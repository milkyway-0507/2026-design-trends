# STUDY_LLM_API_TOKEN secret 필요 (study_live_... 형식)
name: 매주 트렌드 자동 업데이트

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9 → UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-trends.yml'
      - 'scripts/generate-trends.mjs'

jobs:
  update-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      - name: API 토큰 및 Proxy 연결 확인
        env:
          STUDY_LLM_API_TOKEN: ${{ secrets.STUDY_LLM_API_TOKEN }}
        run: |
          # 공백·따옴표 제거
          STUDY_LLM_API_TOKEN=$(printf '%s' "$STUDY_LLM_API_TOKEN" | tr -d '[:space:]' | sed 's/^"//;s/"$//')

          if [ -z "$STUDY_LLM_API_TOKEN" ]; then
            echo "::error::STUDY_LLM_API_TOKEN secret이 비어 있습니다."
            exit 1
          fi

          case "$STUDY_LLM_API_TOKEN" in
            study_live_*|study_test_*)
              echo "✓ 토큰 prefix OK (study_*)"
              ;;
            *)
              echo "::warning::토큰이 study_live_ 로 시작하지 않습니다. HTTP 연결 테스트로 검증합니다."
              echo "토큰 앞 12자: $(printf '%.12s' "$STUDY_LLM_API_TOKEN")..."
              ;;
          esac

          HTTP_CODE=$(curl -sS -o /tmp/llm-test.json -w "%{http_code}" \
            -X POST "https://vibe-llm-proxy-17280846291.asia-northeast3.run.app/api/v1/generate" \
            -H "Authorization: Bearer $STUDY_LLM_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"provider":"google","model":"gemini-3.1-flash-lite","messages":[{"role":"user","content":"ping"}],"maxOutputTokens":16}')

          echo "LLM Proxy HTTP status: $HTTP_CODE"
          echo "Response preview:"
          head -c 400 /tmp/llm-test.json || true
          echo ""

          case "$HTTP_CODE" in
            200)
              echo "✓ LLM Proxy 연결 성공"
              ;;
            401)
              echo "::error::HTTP 401 — 토큰이 유효하지 않습니다. 스터디 포털에서 study_live_... 토큰을 재발급하세요."
              exit 1
              ;;
            403)
              echo "::error::HTTP 403 — 권한 또는 사용 한도 문제입니다. 스터디 포털에서 확인하세요."
              exit 1
              ;;
            *)
              echo "::error::LLM Proxy 연결 실패 (HTTP $HTTP_CODE). 위 Response preview를 확인하세요."
              exit 1
              ;;
          esac

      - name: LLM Proxy로 트렌드 생성
        env:
          STUDY_LLM_API_TOKEN: ${{ secrets.STUDY_LLM_API_TOKEN }}
        run: node scripts/generate-trends.mjs

      - name: 변경사항 확인
        id: check_changes
        run: |
          git diff --quiet src/data/trends.ts src/data/trends-new.ts TREND_UPDATE_LOG.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: main에 자동 커밋 및 푸시
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trends.ts TREND_UPDATE_LOG.md
          git commit -m "✨ 주간 트렌드 자동 업데이트 $(date +'%Y-%m-%d')"
          git push origin main
          echo "✓ main에 푸시 완료 — Vercel 자동 배포 시작"

      - name: 변경 없음
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "추가할 신규 트렌드 없음 — 스킵"
